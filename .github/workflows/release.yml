name: Release

# Pushing a tag such as v0.1.0 builds the binaries and publishes them as a GitHub Release, where
# install.sh downloads them. A pull request that changes the release files only builds them.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml", "install.sh"]

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        # Linux binaries link musl statically, so they run on any distribution.
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches Cargo.toml
        if: github.event_name == 'push'
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - name: Install musl
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          # zstd's C code is compiled for the target with musl's compiler.
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
      # rustup installs the toolchain pinned in rust-toolchain.toml on first use.
      - run: rustup target add "$TARGET"
      - run: cargo test --locked
      - run: cargo build --release --locked --target "$TARGET"
      - name: Package
        shell: bash
        run: |
          binary="target/$TARGET/release/atlas-nano"
          "$binary" --version
          if [ "$RUNNER_OS" = Linux ]; then file "$binary" | grep -q 'static' || { file "$binary"; exit 1; }; fi
          name="atlas-nano-$TARGET"
          tar -czf "$name.tar.gz" -C "target/$TARGET/release" atlas-nano
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: atlas-nano-*.tar.gz*
          if-no-files-found: error

  release:
    name: Publish
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # install.sh ships with each release, so the script and the binaries always match.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a hyphen, such as v0.2.0-rc1, is a prerelease, which "latest" skips.
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" atlas-nano-*.tar.gz* install.sh $prerelease \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
