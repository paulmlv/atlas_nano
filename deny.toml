# cargo-deny checks the dependency tree: `cargo deny check`.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

# Fail on any crate with a security advisory, or one that is unmaintained or yanked.
[advisories]
version = 2
yanked = "deny"

# Only permissive licenses that let Atlas Nano ship under MIT. BSD-3-Clause is zstd's;
# Unicode-3.0 is unicode-ident's data tables.
[licenses]
version = 2
allow = ["Apache-2.0", "BSD-3-Clause", "MIT", "Unicode-3.0", "Zlib"]

# Warn when two versions of one crate are built; refuse wildcard version requirements.
[bans]
multiple-versions = "warn"
wildcards = "deny"

# Crates come from crates.io only.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
