[package]
name = "atlas-nano"
version = "0.2.2"
edition = "2024"
rust-version = "1.99"
description = "Atlas Nano labels and accounts for all local Claude Code and Codex conversations to give insight into AI spend."
readme = "README.md"
license = "MIT"
repository = "https://github.com/paulmlv/atlas_nano"
publish = false

[dependencies]
anstream = "1.0.0"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
rayon = "1.12.0"
regex = "1.13.1"
rlimit = "0.11.0"
rust_decimal = { version = "1.43.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.2.1"
zstd = "0.14.3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
