# API list prices in USD per million tokens at Standard rates, checked on the date below.
#
# Each model, named `client/model`, has a `long_context_above` boundary on a request's total input
# tokens, `short` rates, and optional `long` rates above the boundary. Rates price uncached `input`,
# `cached` input, `cache_write` (Claude's five-minute writes), `cache_write_1h` (Claude's one-hour
# writes), and `output`; both cache-write rates are optional. [priced_as] prices a reported model at
# another model's rates.
#
# Models are listed newest version first and, within a version, by family from largest to smallest,
# with specialized models last.

checked = 2026-11-03

[priced_as]
# Claude Mythos 5.2, 5.1, and 5 have the same rates as Claude Fable 5.2, 5.1, and 5, and Claude
# Opus 4.8 the same as Claude Opus 5.
"claude/claude-mythos-5-2" = "claude/claude-fable-5-2"
"claude/claude-mythos-5-1" = "claude/claude-fable-5-1"
"claude/claude-mythos-5" = "claude/claude-fable-5"
"claude/claude-opus-4-8" = "claude/claude-opus-5"
# https://alignment.openai.com/auto-review/ (2026-04-30) identifies GPT-5.4 Thinking as the reviewer
# and publishes no separate auto-review price.
"codex/codex-auto-review" = "codex/gpt-5.4"

# https://developers.openai.com/api/docs/pricing (Standard). Codex's cache writes use the
# 30-minute rate. Checked 2026-11-11 for GPT-6 Sol and Cyber, GPT-6.1 Terra, GPT-5.6 Terra, and
# GPT-5.4, 2026-11-03 for GPT-6 Astra and GPT-6.1 Sol, and 2026-10-13 for the others.

[models."codex/gpt-6.1-sol"]
long_context_above = 272_000
short = { input = 2.00, cached = 0.10, cache_write = 2.50, output = 10.00 }
long = { input = 4.00, cached = 0.20, cache_write = 5.00, output = 15.00 }

[models."codex/gpt-6.1-terra"]
long_context_above = 272_000
short = { input = 1.00, cached = 0.05, cache_write = 1.25, output = 5.00 }
long = { input = 2.00, cached = 0.10, cache_write = 2.50, output = 7.50 }

[models."codex/gpt-6-astra"]
long_context_above = 272_000
short = { input = 10.00, cached = 1.00, cache_write = 12.50, output = 50.00 }
long = { input = 20.00, cached = 2.00, cache_write = 25.00, output = 75.00 }

[models."codex/gpt-6-sol"]
long_context_above = 272_000
short = { input = 2.00, cached = 0.20, cache_write = 2.50, output = 10.00 }
long = { input = 4.00, cached = 0.40, cache_write = 5.00, output = 15.00 }

[models."codex/gpt-6-luna"]
long_context_above = 272_000
