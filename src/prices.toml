long = { input = 8.00, cached = 0.80, cache_write = 10.00, output = 30.00 }

[models."codex/gpt-5.6-terra"]
# https://developers.openai.com/api/docs/models/gpt-5.6-terra lists input, cached, and output; cache
# writes at 1.25x input; and 2x input and 1.5x output above 272K, with cached input and cache writes
