long = { input = 0.20, cached = 0.02, cache_write = 0.25, output = 0.75 }

[models."codex/gpt-6-cyber"]
# No long-context cache-write rate is published, so it is doubled as for the other models.
long_context_above = 272_000
short = { input = 20.00, cached = 2.00, cache_write = 25.00, output = 100.00 }
long = { input = 40.00, cached = 4.00, cache_write = 50.00, output = 150.00 }

[models."codex/gpt-5.6-sol"]
